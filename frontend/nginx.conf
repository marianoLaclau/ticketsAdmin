server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Endurecimiento compatible con el despliegue HTTP actual. CSP requiere un
    # inventario propio; HSTS y la cookie Secure requieren un borde TLS real.
    server_tokens off;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # SSE: stream de eventos en vivo — sin buffering y con timeout largo,
    # si no nginx acumula los eventos y nunca llegan al navegador
    location /api/events {
        proxy_pass http://backend:5000/api/events;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo estático cae en index.html
    # (el ruteo de páginas lo resuelve React/wouter en el cliente)
    location / {
        try_files $uri /index.html;
    }
}
