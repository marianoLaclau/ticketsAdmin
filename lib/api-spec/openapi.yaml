        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: ["string", "null"]
        dni:
          type: ["string", "null"]
        empresa:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
          format: email
        motivo:
          type: string
        resumen:
          type: ["string", "null"]
        notificado:
          type: boolean
        estado:
          type: string
