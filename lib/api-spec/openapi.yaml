openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.5.0
  description: GSB Ticket Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tickets
    description: Ticket management
  - name: seguimientos
    description: Ticket follow-up tracking
  - name: dashboard
    description: Dashboard statistics
  - name: rendimiento
    description: Indicadores ejecutivos protegidos para SysAdmin y Controller
  - name: webhooks
    description: Ingesta automática de llamadas (n8n)
  - name: admin
    description: Gestión de la base de datos (CRUD manual, importación masiva, truncate)
  - name: auth
    description: >
      Autenticación por sesión. El login setea una cookie httpOnly; toda la API
      funcional exige esa sesión. Healthz, readyz, el webhook de n8n, login y
      el logout idempotente son las únicas excepciones.

security:
  - sessionCookie: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Returns whether the API can receive application traffic
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessUnavailable"

  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List all tickets with optional filters
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [nuevo, en_proceso, pendiente, resuelto, cerrado]
        - name: prioridad
          in: query
          schema:
            type: string
            enum: [baja, media, alta, urgente]
        - name: fecha_desde
          in: query
          schema:
            type: string
            format: date
        - name: fecha_hasta
          in: query
          schema:
            type: string
            format: date
        - name: hora_desde
          in: query
          schema:
            type: string
        - name: hora_hasta
          in: query
          schema:
            type: string
        - name: empresa
          in: query
          schema:
            type: string
        - name: motivo
          in: query
          schema:
            type: string
        - name: motivo_categoria
          in: query
          description: Categoría normalizada derivada del motivo original
          schema:
            $ref: "#/components/schemas/MotivoCategoria"
        - name: search
          in: query
          schema:
            type: string
        - name: vencidos
          in: query
          schema:
            type: boolean
        - name: incluir_vacios
          in: query
          description: >
            Incluye registros en cuarentena sin datos útiles. Requiere sesión
            SysAdmin; el listado operativo los excluye.
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: Columna de ordenamiento aplicada sobre el conjunto completo antes de paginar
          schema:
            $ref: "#/components/schemas/TicketSortBy"
            default: fecha_creacion
        - name: order
          in: query
          description: Orden compuesto por día de creación y, dentro de cada día, por hora del llamado
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: sort
          in: query
          description: >
            Ordenamiento múltiple priorizado, separado por comas y expresado
            como columna:dirección. Ejemplo:
            fecha_creacion:desc,contacto:asc. Cuando se informa, reemplaza a
            sort_by y order.
          schema:
            type: string
            maxLength: 512
          example: fecha_creacion:desc,contacto:asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /tickets/export.csv:
    get:
      operationId: exportTicketsCsv
      tags: [tickets]
      summary: Exportar todos los tickets operativos que coinciden con los filtros
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [nuevo, en_proceso, pendiente, resuelto, cerrado]
        - name: prioridad
          in: query
          schema:
            type: string
            enum: [baja, media, alta, urgente]
        - name: fecha_desde
          in: query
          schema:
            type: string
            format: date
        - name: fecha_hasta
          in: query
          schema:
            type: string
            format: date
        - name: hora_desde
          in: query
          schema:
            type: string
        - name: hora_hasta
          in: query
          schema:
            type: string
        - name: empresa
          in: query
          schema:
            type: string
        - name: motivo
          in: query
          schema:
            type: string
        - name: motivo_categoria
          in: query
          schema:
            $ref: "#/components/schemas/MotivoCategoria"
        - name: search
          in: query
          schema:
            type: string
        - name: vencidos
          in: query
          schema:
            type: boolean
        - name: sort_by
          in: query
          schema:
            $ref: "#/components/schemas/TicketSortBy"
            default: fecha_creacion
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: sort
          in: query
          description: >
            Ordenamiento múltiple priorizado, separado por comas y expresado
            como columna:dirección. Cuando se informa, reemplaza a sort_by y
            order.
          schema:
            type: string
            maxLength: 512
          example: fecha_creacion:desc,contacto:asc
      responses:
        "200":
          description: CSV UTF-8 con todos los resultados filtrados, sin paginación
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Iniciar sesión
      security: []
      description: >
        Valida usuario y contraseña. Si son correctos setea la cookie de sesión
        (httpOnly) y devuelve los datos del usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Cuerpo de login inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "401":
          description: Credenciales inválidas o usuario inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "429":
          description: Demasiados intentos de inicio de sesión
          headers:
            Retry-After:
              description: Segundos que faltan para volver a intentar
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRateLimitError"

  /auth/password:
    post:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Reemplazar la contraseña propia
      description: >
        Verifica la contraseña actual, aplica la política de credenciales
        nuevas, rota la sesión y revoca todos los tokens anteriores del usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnPasswordChangeInput"
      responses:
        "200":
          description: Contraseña actualizada y sesión rotada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Cuerpo inválido, contraseña actual incorrecta o política incumplida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeError"
        "401":
          description: Sesión ausente, vencida o modificada en simultáneo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeError"
        "409":
          description: La contraseña nueva reutiliza la actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cerrar sesión
      security: []
      description: Revoca la sesión actual si existe y limpia la cookie de forma idempotente.
      responses:
        "204":
          description: Sesión cerrada

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Usuario de la sesión actual
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Sin sesión válida

  /webhooks/ticket:
    post:
      operationId: ingestTicket
      tags: [webhooks]
      summary: Ingesta de una llamada desde n8n
      description: >
        Recibe el JSON que arma ElevenLabs al finalizar una llamada.
        Requiere el header x-api-key. Idempotente por conversation_id:
        si el ticket ya existe devuelve 200 con created=false.
      security:
        - webhookApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Ticket creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestResult"
        "200":
          description: El ticket ya existía (reintento)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestResult"
        "401":
          description: API key inválida

  /admin/tickets:
    post:
      operationId: createAdminTicket
      tags: [admin]
      summary: Crear un registro manualmente (solo administración)
      description: >
        Alta manual de un registro desde el panel de administración. El flujo
        normal de creación de tickets sigue siendo el webhook de n8n.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "409":
          description: Ya existe un ticket con ese conversation_id

  /admin/import:
    post:
      operationId: importCsv
      tags: [admin]
      summary: Importación masiva desde CSV
      description: >
        Recibe el contenido de un CSV (texto plano), detecta las columnas con
        los mismos alias que el importador CLI, y crea los registros que no
        existan. Idempotente por conversation_id. Con dry_run true solo simula
        y devuelve el resumen sin escribir nada.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminImportInput"
      responses:
        "200":
          description: Resumen de la importación (o de la simulación)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImportResult"
        "400":
          description: CSV inválido o sin columna conversation_id
        "401":
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /admin/truncate:
    post:
      operationId: truncateTickets
      tags: [admin]
      summary: Borrar todos los registros (truncate)
      description: >
        Elimina TODOS los tickets y seguimientos y reinicia los contadores de
        id. El schema queda intacto. Requiere confirmar explícitamente.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTruncateInput"
      responses:
        "200":
          description: Registros eliminados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTruncateResult"
        "400":
          description: Falta la confirmación explícita
        "401":
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /admin/roles:
    get:
      operationId: listAdminRoles
      tags: [admin]
      summary: Listar roles
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Lista paginada de roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleListResponse"
        "400":
          description: Parametros de consulta invalidos
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

    post:
      operationId: createAdminRole
      tags: [admin]
      summary: Crear un rol
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleInput"
      responses:
        "201":
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        "400":
          description: Cuerpo invalido
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "409":
          description: El nombre ya existe o está reservado para un rol del sistema

  /admin/roles/{id}:
    patch:
      operationId: updateAdminRole
      tags: [admin]
      summary: Actualizar un rol
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleUpdate"
      responses:
        "200":
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        "400":
          description: Id o cuerpo invalido
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "404":
          description: Rol no encontrado
        "409":
          description: El nombre ya existe/está reservado o el rol del sistema no admite ese cambio

    delete:
      operationId: deleteAdminRole
      tags: [admin]
      summary: Eliminar un rol sin usuarios asignados
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Rol eliminado
        "400":
          description: Id invalido
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "404":
          description: Rol no encontrado
        "409":
          description: El rol está protegido o tiene usuarios asignados

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Listar usuarios
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: activo
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "400":
          description: Parametros de consulta invalidos
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Crear un usuario
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Cuerpo invalido o rol inexistente
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "409":
          description: El email/username ya existe o el rol indicado está inactivo

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Actualizar o desactivar un usuario
      description: >
        Los usuarios se desactivan estableciendo activo en false; no se eliminan.
        Desactivar la cuenta o cambiarla realmente de rol revoca todas sus
        sesiones activas. Reenviar el mismo role_id conserva la sesión.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Id o cuerpo invalido
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "404":
          description: Usuario o rol no encontrado
        "409":
          description: El email/username ya existe, el rol está inactivo o el cambio eliminaría al último SysAdmin utilizable

    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Eliminar definitivamente un usuario
      description: >
        Borrado físico e irreversible. Exige doble aprobación en el cuerpo:
        confirmar en true y el nombre de usuario exacto, para que un id
        equivocado no elimine a otra persona. El historial se conserva: las
        referencias en tickets y seguimientos quedan en null y el nombre
        registrado en cada movimiento permanece como snapshot textual.
        La cuenta propia y el último SysAdmin utilizable nunca se pueden borrar;
        para esos casos existe la desactivación.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserDeleteInput"
      responses:
        "204":
          description: Usuario eliminado
        "400":
          description: Id o cuerpo invalido, o falta la confirmación explícita
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "404":
          description: Usuario no encontrado
        "409":
          description: >
            El nombre de usuario no coincide, es la cuenta propia o eliminaría
            al último SysAdmin utilizable

  /admin/users/{id}/password:
    post:
      operationId: resetAdminUserPassword
      tags: [admin]
      summary: Establecer o reestablecer la contraseña de un usuario
      description: >
        Asigna una contraseña nueva al usuario (hasheada con scrypt) y revoca
        todas sus sesiones activas: si estaba logueado en algún navegador,
        queda afuera y debe volver a entrar con la clave nueva.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserPasswordInput"
      responses:
        "204":
          description: Contraseña actualizada y sesiones revocadas
        "400":
          description: Id o cuerpo invalido
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "404":
          description: Usuario no encontrado

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get ticket details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: incluir_vacios
          in: query
          description: >
            Permite abrir registros en cuarentena; requiere SysAdmin.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "404":
          description: Not found

    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update a ticket
      description: |
        Las actualizaciones operativas y el enriquecimiento de contacto,
        motivo o resumen requieren una sesión válida. Los campos técnicos y
        el acceso a registros en cuarentena requieren además rol SysAdmin,
        rol SysAdmin. El body debe incluir expected_version junto a
        por lo menos un campo editable; una versión desactualizada devuelve
        TICKET_VERSION_CONFLICT sin persistir ni auditar el intento.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: incluir_vacios
          in: query
          description: >
            Permite modificar registros en cuarentena; requiere SysAdmin,
            rol SysAdmin.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Body inválido, versión ausente o sin campos editables
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"
        "409":
          description: El ticket cambió después de que el cliente abrió el editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketVersionConflict"

    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket (solo SysAdmin)
      description: >
        Requiere sesion con rol SysAdmin.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /tickets/{id}/seguimientos:
    get:
      operationId: listSeguimientos
      tags: [seguimientos]
      summary: List follow-ups for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: incluir_vacios
          in: query
          description: >
            Permite consultar un registro en cuarentena; requiere SysAdmin,
            rol SysAdmin.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of follow-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Seguimiento"
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

    post:
      operationId: createSeguimiento
      tags: [seguimientos]
      summary: Add a follow-up to a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: incluir_vacios
          in: query
          description: >
            Permite agregar seguimiento a un registro en cuarentena; requiere
            SysAdmin.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeguimientoInput"
      responses:
        "201":
          description: Created follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seguimiento"
        "401":
          description: Sesion invalida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      parameters:
        - $ref: "#/components/parameters/DashboardFechaDesde"
        - $ref: "#/components/parameters/DashboardFechaHasta"
      responses:
        "400":
          description: Invalid dashboard date range
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /dashboard/actividad-reciente:
    get:
      operationId: getActividadReciente
      tags: [dashboard]
      summary: Get recent ticket activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - $ref: "#/components/parameters/DashboardFechaDesde"
        - $ref: "#/components/parameters/DashboardFechaHasta"
      responses:
        "400":
          description: Invalid dashboard date range
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActividadItem"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /dashboard/tickets-vencidos:
    get:
      operationId: getTicketsVencidos
      tags: [dashboard]
      summary: Get overdue tickets
      parameters:
        - $ref: "#/components/parameters/DashboardFechaDesde"
        - $ref: "#/components/parameters/DashboardFechaHasta"
      responses:
        "400":
          description: Invalid dashboard date range
        "200":
          description: Overdue tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /dashboard/motivos:
    get:
      operationId: getMotivoStats
      tags: [dashboard]
      summary: Get ticket counts grouped by normalized contact category
      parameters:
        - $ref: "#/components/parameters/DashboardFechaDesde"
        - $ref: "#/components/parameters/DashboardFechaHasta"
      responses:
        "400":
          description: Invalid dashboard date range
        "200":
          description: Contact category statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MotivoStat"
        "403":
          $ref: "#/components/responses/FunctionalAccessForbidden"

  /rendimiento:
    get:
      operationId: getRendimientoStatus
      tags: [rendimiento]
      summary: Get performance module status
      description: >
        Confirma la disponibilidad y las vistas del módulo ejecutivo. Las vistas
        operativas exponen únicamente métricas con alcance y muestra explícitos.
      responses:
        "200":
          description: Performance module status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RendimientoModuleStatus"
        "401":
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          description: El rol no puede consultar Rendimiento
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, error]
                properties:
                  code:
                    type: string
                    enum: [PERFORMANCE_ACCESS_REQUIRED]
                  error:
                    type: string

  /rendimiento/calidad-datos:
    get:
      operationId: getRendimientoCalidadDatos
      tags: [rendimiento]
      summary: Consultar la cobertura de datos para métricas de rendimiento
      description: |
        Evalúa si los datos disponibles permiten construir indicadores de equipo
        e individuales sin presentar estimaciones como hechos auditables.

        La cohorte contiene únicamente tickets visibles cuya `fecha_creacion`
        pertenece al período solicitado. `empresa`, `motivo_categoria` y
        `prioridad` restringen esa misma cohorte; todos los denominadores se
        calculan después de aplicar esos filtros.

        Una resolución evaluable para atribución es exclusivamente una transición
        de un estado no final a `resuelto` o `cerrado`. Un cambio posterior de
        `resuelto` a `cerrado` no crea una segunda resolución.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RendimientoFechaDesde"
        - $ref: "#/components/parameters/RendimientoFechaHasta"
        - $ref: "#/components/parameters/RendimientoEmpresa"
        - $ref: "#/components/parameters/RendimientoMotivoCategoria"
        - $ref: "#/components/parameters/RendimientoPrioridad"
      responses:
        "200":
          description: Coberturas de calidad de la cohorte filtrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RendimientoCalidadDatos"
        "400":
          description: Filtros o período inválidos
        "401":
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          description: El rol no puede consultar Rendimiento
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, error]
                properties:
                  code:
                    type: string
                    enum: [PERFORMANCE_ACCESS_REQUIRED]
                  error:
                    type: string

  /rendimiento/resumen-equipo:
    get:
      operationId: getRendimientoResumenEquipo
      tags: [rendimiento]
      summary: Consultar el resumen de rendimiento del equipo
      description: |
        Resume tickets visibles cuya `fecha_creacion` pertenece al período
        solicitado. `empresa`, `motivo_categoria` y `prioridad` restringen esa
        misma cohorte antes de calcular cualquier métrica.

        `estado_actual` y las distribuciones son una fotografía al instante
        `generado_en`: describen el estado actual de la cohorte por creación, no
        el estado que los tickets tenían dentro del período.

        `cumplimiento_plazo_auditable` considera únicamente transiciones de un
        estado no final a `resuelto` o `cerrado` que conservaron el snapshot del
        plazo vigente al resolverse. El cambio `resuelto` a `cerrado` no cuenta
        como otra resolución.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RendimientoFechaDesde"
        - $ref: "#/components/parameters/RendimientoFechaHasta"
        - $ref: "#/components/parameters/RendimientoEmpresa"
        - $ref: "#/components/parameters/RendimientoMotivoCategoria"
        - $ref: "#/components/parameters/RendimientoPrioridad"
      responses:
        "200":
          description: Resumen de equipo para la cohorte filtrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RendimientoResumenEquipo"
        "400":
          description: Filtros o período inválidos
        "401":
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          description: El rol no puede consultar Rendimiento
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, error]
                properties:
                  code:
                    type: string
                    enum: [PERFORMANCE_ACCESS_REQUIRED]
                  error:
                    type: string

  /rendimiento/personas:
    get:
      operationId: getRendimientoPersonas
      tags: [rendimiento]
      summary: Consultar indicadores auditables por persona
      description: |
        Usa la misma cohorte de tickets visibles por `fecha_creacion` que las
        demás vistas de Rendimiento. `empresa`, `motivo_categoria` y `prioridad`
        se aplican antes de calcular cualquier indicador.

        Una resolución se atribuye exclusivamente al `autor_usuario_id` de una
        transición desde un estado no final hacia `resuelto` o `cerrado`. El
        cambio posterior de `resuelto` a `cerrado` no crea otra resolución. El
        tiempo atribuible son horas corridas desde la creación del ticket hasta
        ese evento; no representa tiempo exclusivo de trabajo de la persona.

        El cumplimiento solo usa eventos atribuibles que conservaron
        `fecha_limite_snapshot`. La carga es una fotografía al instante
        `generado_en` de tickets abiertos con `asignado_usuario_id` estructurado.
        `resoluciones_reabiertas` observa el resultado de una resolución
        atribuible: cuenta esa resolución una sola vez si luego existe una
        transición de estado final a no final antes de la siguiente resolución
        del mismo ticket. Es contexto operativo, no una calificación negativa.

        Las personas se devuelven alfabéticamente, nunca como ranking. La API no
        calcula puntajes ni posiciones y explicita la cobertura global para que
        una muestra pequeña o incompleta no se presente como comparable.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RendimientoFechaDesde"
        - $ref: "#/components/parameters/RendimientoFechaHasta"
        - $ref: "#/components/parameters/RendimientoEmpresa"
        - $ref: "#/components/parameters/RendimientoMotivoCategoria"
        - $ref: "#/components/parameters/RendimientoPrioridad"
      responses:
        "200":
          description: Indicadores individuales de la cohorte filtrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RendimientoPersonas"
        "400":
          description: Filtros o período inválidos
        "401":
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          description: El rol no puede consultar Rendimiento
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, error]
                properties:
                  code:
                    type: string
                    enum: [PERFORMANCE_ACCESS_REQUIRED]
                  error:
                    type: string

  /rendimiento/reiteraciones:
    get:
      operationId: getRendimientoReiteraciones
      tags: [rendimiento]
      summary: Detectar contactos reiterados con tickets todavía abiertos
      description: |
        Detecta reiteraciones dentro de la misma cohorte de tickets visibles por
        `fecha_creacion`; `empresa`, `motivo_categoria` y `prioridad` se aplican
        antes de agrupar. Un contacto solo aparece cuando reúne al menos dos
        tickets distintos y conserva al menos uno en estado no final.

        Cada ticket recibe una única clave canónica, con precedencia DNI,
        teléfono y email. Una identidad secundaria solo hereda un DNI cuando su
        relación directa dentro de la cohorte es unívoca; las relaciones ambiguas
        se conservan separadas y nunca se encadenan transitivamente. Por eso esta
        vista describe coincidencias operativas, no una identidad civil probada
        ni confirma que una persona haya quedado sin respuesta.

        La API nunca devuelve DNI, teléfono o email completos. Expone una clave
        de grupo opaca, un valor enmascarado y los ids de tickets necesarios para
        revisar el caso. Los grupos se ordenan por riesgo: primero vencidos,
        luego prioridad máxima, antigüedad del abierto, último contacto y clave.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RendimientoFechaDesde"
        - $ref: "#/components/parameters/RendimientoFechaHasta"
        - $ref: "#/components/parameters/RendimientoEmpresa"
        - $ref: "#/components/parameters/RendimientoMotivoCategoria"
        - $ref: "#/components/parameters/RendimientoPrioridad"
      responses:
        "200":
          description: Contactos reiterados de la cohorte filtrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RendimientoReiteraciones"
        "400":
          description: Filtros o período inválidos
        "401":
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessUnauthorized"
        "403":
          description: El rol no puede consultar Rendimiento
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, error]
                properties:
                  code:
                    type: string
                    enum: [PERFORMANCE_ACCESS_REQUIRED]
                  error:
                    type: string

components:
  parameters:
    DashboardFechaDesde:
      name: fecha_desde
      in: query
      description: Primer dia incluido en el periodo del dashboard (YYYY-MM-DD).
      schema:
        type: string
        format: date
    DashboardFechaHasta:
      name: fecha_hasta
      in: query
      description: Ultimo dia incluido en el periodo del dashboard (YYYY-MM-DD).
      schema:
        type: string
        format: date
    RendimientoFechaDesde:
      name: fecha_desde
      in: query
      description: Primer día incluido según fecha_creacion del ticket (YYYY-MM-DD).
      schema:
        type: string
        format: date
    RendimientoFechaHasta:
      name: fecha_hasta
      in: query
      description: Último día incluido según fecha_creacion del ticket (YYYY-MM-DD).
      schema:
        type: string
        format: date
    RendimientoEmpresa:
      name: empresa
      in: query
      description: Texto contenido en la empresa de los tickets incluidos en la cohorte.
      schema:
        type: string
    RendimientoMotivoCategoria:
      name: motivo_categoria
      in: query
      description: Categoría normalizada de los tickets incluidos en la cohorte.
      schema:
        $ref: "#/components/schemas/MotivoCategoria"
    RendimientoPrioridad:
      name: prioridad
      in: query
      description: Prioridad actual de los tickets incluidos en la cohorte.
      schema:
        type: string
        enum: [baja, media, alta, urgente]

  responses:
    FunctionalAccessForbidden:
      description: La contraseña temporal debe reemplazarse o el rol no permite la operación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FunctionalAccessError"

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gsb_session
      description: Cookie httpOnly emitida por POST /auth/login y validada por el backend.
    webhookApiKey:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    RendimientoModuleStatus:
      type: object
      additionalProperties: false
      required:
        - modulo
        - estado
        - vistas
      properties:
        modulo:
          type: string
          enum: [rendimiento]
        estado:
          type: string
          enum: [operativo_parcial]
          description: Resumen, Personas, Reiteraciones y Calidad de datos operativos; el módulo continúa en validación integral.
        vistas:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - resumen_equipo
              - personas
              - reiteraciones
              - calidad_datos

    RendimientoPeriodo:
      type: object
      additionalProperties: false
      required:
        - fecha_desde
        - fecha_hasta
        - timezone
        - generado_en
      properties:
        fecha_desde:
          description: Primer día incluido por fecha_creacion, o null si no se limitó el inicio.
          type: [string, "null"]
          format: date
        fecha_hasta:
          description: Último día incluido por fecha_creacion, o null si no se limitó el fin.
          type: [string, "null"]
          format: date
        timezone:
          type: string
          enum: [America/Argentina/Buenos_Aires]
        generado_en:
          type: string
          format: date-time
          description: Instante del snapshot consistente usado para calcular la respuesta.

    RendimientoProporcion:
      type: object
      additionalProperties: false
      description: La proporción usa la cohorte filtrada; porcentaje es null cuando el denominador es cero.
      required:
        - numerador
        - denominador
        - porcentaje
      properties:
        numerador:
          type: integer
          minimum: 0
        denominador:
          type: integer
          minimum: 0
        porcentaje:
          type: [number, "null"]
          minimum: 0
          maximum: 100

    RendimientoCoberturasCalidadDatos:
      type: object
      additionalProperties: false
      required:
        - actor_resolucion
        - fecha_resolucion
        - plazo_resolucion
        - asignacion_estructurada
        - identidad_contacto
        - fecha_limite
      properties:
        actor_resolucion:
          allOf:
            - $ref: "#/components/schemas/RendimientoProporcion"
          description: >
            Resoluciones evaluadas con autor_usuario_id persistido sobre el total de
            transiciones no-final a final de los tickets de la cohorte.
        fecha_resolucion:
          allOf:
            - $ref: "#/components/schemas/RendimientoProporcion"
          description: >
            Tickets actualmente en estado final con fecha_resolucion sobre el total
            de tickets actualmente en estado final de la cohorte.
        plazo_resolucion:
          allOf:
            - $ref: "#/components/schemas/RendimientoProporcion"
          description: >
            Resoluciones evaluadas que conservaron el plazo vigente al resolverse
            sobre el total de transiciones no-final a final de la cohorte.
        asignacion_estructurada:
          allOf:
            - $ref: "#/components/schemas/RendimientoProporcion"
          description: >
            Tickets con asignado_usuario_id sobre los tickets que poseen alguna
            asignación estructurada o histórica dentro de la cohorte.
        identidad_contacto:
          allOf:
            - $ref: "#/components/schemas/RendimientoProporcion"
          description: >
            Tickets con al menos un DNI, teléfono o email normalizado utilizable
            sobre todos los tickets de la cohorte.
        fecha_limite:
          allOf:
            - $ref: "#/components/schemas/RendimientoProporcion"
          description: Tickets con fecha_limite válida sobre todos los tickets de la cohorte.

    RendimientoCalidadDatos:
      type: object
      additionalProperties: false
      required:
        - periodo
        - tickets_evaluados
        - resoluciones_evaluadas
        - atribucion_desde
        - comparacion_individual_estado
        - coberturas
      properties:
        periodo:
          $ref: "#/components/schemas/RendimientoPeriodo"
        tickets_evaluados:
          type: integer
          minimum: 0
          description: Tickets visibles de la cohorte después de aplicar todos los filtros.
        resoluciones_evaluadas:
          type: integer
          minimum: 0
          description: >
            Transiciones no-final a final encontradas para los tickets de la cohorte;
            es el denominador de actor_resolucion.
        atribucion_desde:
          type: [string, "null"]
          format: date-time
          description: >
            Primera resolución con autor_usuario_id estructurado observable en el
            historial persistido, o null cuando todavía no existe.
        comparacion_individual_estado:
          type: string
          enum: [insuficiente, parcial, disponible]
          description: >
            insuficiente impide comparar personas; parcial exige advertir cobertura
            incompleta; disponible indica que se alcanzó el umbral auditable del servidor.
        coberturas:
          $ref: "#/components/schemas/RendimientoCoberturasCalidadDatos"

    RendimientoEstadoActual:
      type: object
      additionalProperties: false
      description: >
        Fotografía actual de la cohorte definida por fecha_creacion. abiertos
        comprende nuevo, en_proceso y pendiente; finalizados comprende resuelto y
        cerrado; vencidos_abiertos es un subconjunto de abiertos cuyo plazo ya pasó
        al instante generado_en.
      required:
        - total
        - abiertos
        - finalizados
        - vencidos_abiertos
      properties:
        total:
          type: integer
          minimum: 0
        abiertos:
          type: integer
          minimum: 0
        finalizados:
          type: integer
          minimum: 0
        vencidos_abiertos:
          type: integer
          minimum: 0

    RendimientoResolucionConFecha:
      type: object
      additionalProperties: false
      description: >
        Horas corridas desde fecha_creacion hasta fecha_resolucion para tickets
        actualmente finalizados de la cohorte que poseen ambas fechas válidas y una
        duración no negativa. Las duraciones son null cuando muestra es cero.
      required:
        - muestra
        - promedio_horas
        - mediana_horas
      properties:
        muestra:
          type: integer
          minimum: 0
        promedio_horas:
          type: [number, "null"]
          minimum: 0
        mediana_horas:
          type: [number, "null"]
          minimum: 0

    RendimientoCumplimientoPlazoAuditable:
      type: object
      additionalProperties: false
      description: >
        Cumplimiento basado exclusivamente en transiciones no-final a final con
        fecha_limite_snapshot. Una resolución cumple cuando la fecha del evento no
        supera ese snapshot. porcentaje es null cuando muestra es cero.
      required:
        - muestra
        - cumplidos
        - porcentaje
      properties:
        muestra:
          type: integer
          minimum: 0
        cumplidos:
          type: integer
          minimum: 0
        porcentaje:
          type: [number, "null"]
          minimum: 0
          maximum: 100

    RendimientoDistribucionEstado:
      type: object
      additionalProperties: false
      required:
        - nuevo
        - en_proceso
        - pendiente
        - resuelto
        - cerrado
      properties:
        nuevo:
          type: integer
          minimum: 0
        en_proceso:
          type: integer
          minimum: 0
        pendiente:
          type: integer
          minimum: 0
        resuelto:
          type: integer
          minimum: 0
        cerrado:
          type: integer
          minimum: 0

    RendimientoDistribucionPrioridad:
      type: object
      additionalProperties: false
      required:
        - baja
        - media
        - alta
        - urgente
      properties:
        baja:
          type: integer
          minimum: 0
        media:
          type: integer
          minimum: 0
        alta:
          type: integer
          minimum: 0
        urgente:
          type: integer
          minimum: 0

    RendimientoResumenEquipo:
      type: object
      additionalProperties: false
      required:
        - periodo
        - tickets_ingresados
        - estado_actual
        - resolucion_con_fecha
        - cumplimiento_plazo_auditable
        - distribucion_estado
        - distribucion_prioridad
      properties:
        periodo:
          $ref: "#/components/schemas/RendimientoPeriodo"
        tickets_ingresados:
          type: integer
          minimum: 0
          description: >
            Tickets visibles cuya fecha_creacion pertenece al período y satisface
            todos los filtros; coincide con estado_actual.total.
        estado_actual:
          $ref: "#/components/schemas/RendimientoEstadoActual"
        resolucion_con_fecha:
          $ref: "#/components/schemas/RendimientoResolucionConFecha"
        cumplimiento_plazo_auditable:
          $ref: "#/components/schemas/RendimientoCumplimientoPlazoAuditable"
        distribucion_estado:
          description: >
            Estado actual de la cohorte; incluye todos los estados conocidos, aun
            cuando su cantidad sea cero.
          allOf:
            - $ref: "#/components/schemas/RendimientoDistribucionEstado"
        distribucion_prioridad:
          description: >
            Prioridad actual de la cohorte; incluye todas las prioridades conocidas,
            aun cuando su cantidad sea cero.
          allOf:
            - $ref: "#/components/schemas/RendimientoDistribucionPrioridad"

    RendimientoPersonasCobertura:
      type: object
      additionalProperties: false
      description: >
        Cobertura global de autoría para las resoluciones de la cohorte. El
        estado de comparación usa el mismo criterio auditable que Calidad de
        datos; aun cuando sea disponible, cada muestra individual debe quedar
        visible y la respuesta no constituye un ranking.
      required:
        - resoluciones_evaluadas
        - resoluciones_atribuidas
        - porcentaje_atribucion
        - atribucion_desde
        - comparacion_individual_estado
        - minimo_resoluciones_comparables
        - umbral_cobertura_parcial_porcentaje
        - umbral_cobertura_disponible_porcentaje
      properties:
        resoluciones_evaluadas:
          type: integer
          minimum: 0
          description: Total de transiciones no-final a final de la cohorte.
        resoluciones_atribuidas:
          type: integer
          minimum: 0
          description: >
            Resoluciones evaluadas con autor_usuario_id que referencia un
            usuario persistido.
        porcentaje_atribucion:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: >
            Porcentaje de resoluciones atribuidas; null cuando
            resoluciones_evaluadas es cero.
        atribucion_desde:
          type: [string, "null"]
          format: date-time
          description: >
            Primera resolución atribuible de la cohorte, o null cuando no hay
            ninguna.
        comparacion_individual_estado:
          type: string
          enum: [insuficiente, parcial, disponible]
          description: >
            insuficiente cuando hay menos de 10 resoluciones evaluadas o menos
            de 80% de autoría; parcial desde 80% y antes de 95%; disponible a
            partir de 95%. disponible acredita cobertura global, no una muestra
            individual suficiente ni permiso para construir un ranking.
        minimo_resoluciones_comparables:
          type: integer
          enum: [10]
          description: Muestra global mínima exigida antes de comparar personas.
        umbral_cobertura_parcial_porcentaje:
          type: number
          enum: [80]
          description: Cobertura de autoría desde la cual el estado puede ser parcial.
        umbral_cobertura_disponible_porcentaje:
          type: number
          enum: [95]
          description: Cobertura de autoría desde la cual el estado puede ser disponible.

    RendimientoPersonaUsuario:
      type: object
      additionalProperties: false
      description: >
        Identidad actual de un usuario persistido. No expone email, username ni
        credenciales. activo conserva contexto para actividad histórica de
        cuentas hoy desactivadas.
      required:
        - id
        - nombre
        - rol
        - activo
      properties:
        id:
          type: integer
          minimum: 1
        nombre:
          type: string
          minLength: 1
          description: Nombre y apellido actuales, normalizados para presentación.
        rol:
          type: string
          minLength: 1
          description: Nombre actual del rol asociado al usuario.
        activo:
          type: boolean

    RendimientoTiempoResolucionAtribuible:
      type: object
      additionalProperties: false
      description: >
        Horas corridas desde fecha_creacion del ticket hasta cada transición
        no-final a final atribuida a la persona. Solo incluye duraciones válidas
        y no negativas. No mide tiempo exclusivo de trabajo. promedio_horas y
        mediana_horas son null cuando muestra es cero.
      required:
        - muestra
        - promedio_horas
        - mediana_horas
      properties:
        muestra:
          type: integer
          minimum: 0
        promedio_horas:
          type: [number, "null"]
          minimum: 0
        mediana_horas:
          type: [number, "null"]
          minimum: 0

    RendimientoCumplimientoPersonaAuditable:
      type: object
      additionalProperties: false
      description: >
        Resoluciones atribuibles a la persona que conservaron
        fecha_limite_snapshot. Cumple cuando la fecha del evento no supera el
        snapshot; porcentaje es null cuando muestra es cero.
      required:
        - muestra
        - cumplidos
        - porcentaje
      properties:
        muestra:
          type: integer
          minimum: 0
        cumplidos:
          type: integer
          minimum: 0
        porcentaje:
          type: [number, "null"]
          minimum: 0
          maximum: 100

    RendimientoCargaActualPersona:
      type: object
      additionalProperties: false
      description: >
        Fotografía de la cohorte al instante generado_en. Solo cuenta tickets
        actualmente no finales cuyo asignado_usuario_id coincide con la persona;
        vencidos_asignados es un subconjunto de abiertos_asignados.
      required:
        - abiertos_asignados
        - vencidos_asignados
      properties:
        abiertos_asignados:
          type: integer
          minimum: 0
        vencidos_asignados:
          type: integer
          minimum: 0

    RendimientoPersona:
      type: object
      additionalProperties: false
      description: >
        Indicadores auditables de una persona. Las cantidades son hechos
        independientes; no se combinan en un puntaje ni determinan una posición.
      required:
        - usuario
        - tickets_resueltos
        - resoluciones_atribuidas
        - tiempo_resolucion_atribuible
        - cumplimiento_plazo_auditable
        - carga_actual
        - resoluciones_reabiertas
      properties:
        usuario:
          $ref: "#/components/schemas/RendimientoPersonaUsuario"
        tickets_resueltos:
          type: integer
          minimum: 0
          description: >
            Tickets distintos con al menos una resolución atribuida a la
            persona. Puede ser menor que resoluciones_atribuidas cuando el mismo
            ticket fue reabierto y resuelto nuevamente por ella.
        resoluciones_atribuidas:
          type: integer
          minimum: 0
          description: >
            Eventos no-final a final cuyo autor_usuario_id coincide con el
            usuario. Un ticket puede aportar más de uno si fue reabierto y
            resuelto nuevamente.
        tiempo_resolucion_atribuible:
          $ref: "#/components/schemas/RendimientoTiempoResolucionAtribuible"
        cumplimiento_plazo_auditable:
          $ref: "#/components/schemas/RendimientoCumplimientoPersonaAuditable"
        carga_actual:
          $ref: "#/components/schemas/RendimientoCargaActualPersona"
        resoluciones_reabiertas:
          type: integer
          minimum: 0
          description: >
            Resoluciones atribuibles de la persona tras las que ocurrió al menos
            una transición final a no-final y antes de la siguiente resolución
            del mismo ticket. Cada resolución se cuenta como máximo una vez; no
            atribuye la acción de reabrir y no implica una evaluación negativa.

    RendimientoPersonas:
      type: object
      additionalProperties: false
      required:
        - periodo
        - tickets_evaluados
        - cobertura
        - personas
      properties:
        periodo:
          $ref: "#/components/schemas/RendimientoPeriodo"
        tickets_evaluados:
          type: integer
          minimum: 0
          description: Tickets visibles de la cohorte luego de aplicar todos los filtros.
        cobertura:
          $ref: "#/components/schemas/RendimientoPersonasCobertura"
        personas:
          type: array
          description: >
            Todos los usuarios persistidos, activos o inactivos, ordenados por
            nombre y luego por id. El orden es alfabético, no un ranking.
          items:
            $ref: "#/components/schemas/RendimientoPersona"

    RendimientoReiteracionesCobertura:
      type: object
      additionalProperties: false
      description: >
        Cobertura de identidad de la cohorte. ambiguos_detectados cuenta tickets
        cuya identidad secundaria utilizable apunta directamente a más de un DNI;
        esos casos no se fusionan de forma transitiva.
      required:
        - identidad_utilizable
        - ambiguos_detectados
        - criterio
      properties:
        identidad_utilizable:
          $ref: "#/components/schemas/RendimientoProporcion"
        ambiguos_detectados:
          type: integer
          minimum: 0
        criterio:
          type: string
          enum: [clave_canonica_no_transitiva]

    RendimientoReiteracionesResumen:
      type: object
      additionalProperties: false
      required:
        - contactos_reiterados
        - tickets_involucrados
        - abiertos
        - vencidos_abiertos
      properties:
        contactos_reiterados:
          type: integer
          minimum: 0
        tickets_involucrados:
          type: integer
          minimum: 0
        abiertos:
          type: integer
          minimum: 0
        vencidos_abiertos:
          type: integer
          minimum: 0

    RendimientoReiteracionCoincidencia:
      type: object
      additionalProperties: false
      description: Identificador operativo enmascarado; nunca contiene el dato completo.
      required:
        - tipo
        - valor_enmascarado
      properties:
        tipo:
          type: string
          enum: [dni, telefono, email]
        valor_enmascarado:
          type: string
          minLength: 1

    RendimientoReiteracionResponsable:
      type: object
      additionalProperties: false
      required:
        - usuario_id
        - nombre
        - cantidad_abiertos
      properties:
        usuario_id:
          type: [integer, "null"]
          minimum: 1
        nombre:
          type: string
          minLength: 1
          description: Nombre visible del responsable o `Sin asignar`.
        cantidad_abiertos:
          type: integer
          minimum: 1

    RendimientoReiteracionTicket:
      type: object
      additionalProperties: false
      required:
        - id
        - fecha_creacion
        - estado
        - prioridad
        - fecha_limite
        - vencido
        - motivo_categoria
        - asignado_usuario_id
        - asignado_a
      properties:
        id:
          type: integer
          minimum: 1
        fecha_creacion:
          type: string
          format: date-time
        estado:
          type: string
          enum: [nuevo, en_proceso, pendiente, resuelto, cerrado]
        prioridad:
          type: string
          enum: [baja, media, alta, urgente]
        fecha_limite:
          type: [string, "null"]
          format: date-time
        vencido:
          type: boolean
        motivo_categoria:
          $ref: "#/components/schemas/MotivoCategoria"
        asignado_usuario_id:
          type: [integer, "null"]
          minimum: 1
        asignado_a:
          type: [string, "null"]

    RendimientoReiteracionContacto:
      type: object
      additionalProperties: false
      required:
        - grupo_id
        - nombre_referencia
        - coincidencia
        - cantidad_llamados
        - abiertos
        - vencidos_abiertos
        - primer_contacto
        - ultimo_contacto
        - antiguedad_abierto_horas
        - prioridad_maxima
        - responsables
        - tickets
      properties:
        grupo_id:
          type: string
          minLength: 1
          description: Identificador opaco y no reversible, estable solo dentro de la respuesta.
        nombre_referencia:
          type: string
          minLength: 1
          description: Nombre del contacto más reciente o `Sin nombre proporcionado`.
        coincidencia:
          $ref: "#/components/schemas/RendimientoReiteracionCoincidencia"
        cantidad_llamados:
          type: integer
          minimum: 2
        abiertos:
          type: integer
          minimum: 1
        vencidos_abiertos:
          type: integer
          minimum: 0
        primer_contacto:
          type: string
          format: date-time
        ultimo_contacto:
          type: string
          format: date-time
        antiguedad_abierto_horas:
          type: [number, "null"]
          minimum: 0
          description: Horas corridas desde el ticket abierto más antiguo al snapshot.
        prioridad_maxima:
          type: string
          enum: [baja, media, alta, urgente]
        responsables:
          type: array
          items:
            $ref: "#/components/schemas/RendimientoReiteracionResponsable"
        tickets:
          type: array
          minItems: 2
          description: Tickets del grupo ordenados desde el contacto más reciente.
          items:
            $ref: "#/components/schemas/RendimientoReiteracionTicket"

    RendimientoReiteraciones:
      type: object
      additionalProperties: false
      required:
        - periodo
        - tickets_evaluados
        - cobertura
        - resumen
        - contactos
      properties:
        periodo:
          $ref: "#/components/schemas/RendimientoPeriodo"
        tickets_evaluados:
          type: integer
          minimum: 0
        cobertura:
          $ref: "#/components/schemas/RendimientoReiteracionesCobertura"
        resumen:
          $ref: "#/components/schemas/RendimientoReiteracionesResumen"
        contactos:
          type: array
          description: >
            Grupos con dos o más tickets y al menos uno abierto, ordenados por
            riesgo operativo y nunca como una identificación civil definitiva.
          items:
            $ref: "#/components/schemas/RendimientoReiteracionContacto"

    FunctionalAccessError:
      type: object
      required:
        - error
      properties:
        code:
          type: string
          enum: [PASSWORD_CHANGE_REQUIRED, SYSADMIN_REQUIRED]
          description: Código estable que identifica la frontera funcional que bloqueó la operación.
        error:
          type: string

    PasswordChangeError:
      type: object
      required:
        - code
        - error
      properties:
        code:
          type: string
          enum:
            - INVALID_BODY
            - CURRENT_PASSWORD_INVALID
            - NEW_PASSWORD_POLICY_VIOLATION
            - PASSWORD_REUSE_NOT_ALLOWED
            - SESSION_INVALID
            - SESSION_CHANGED
        error:
          type: string

    LoginError:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    LoginRateLimitError:
      type: object
      required:
        - code
        - error
        - retry_after_seconds
      properties:
        code:
          type: string
          enum: [LOGIN_RATE_LIMITED]
        error:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 1

    AdminAccessUnauthorized:
      type: object
      additionalProperties: false
      required:
        - code
        - error
      properties:
        code:
          type: string
          enum: [SESSION_INVALID]
        error:
          type: string

    TicketVersionConflict:
      type: object
      required:
        - code
        - error
        - ticket_id
        - expected_version
        - current_version
      properties:
        code:
          type: string
          enum: [TICKET_VERSION_CONFLICT]
        error:
          type: string
        ticket_id:
          type: integer
        expected_version:
          type: integer
          minimum: 1
        current_version:
          type: integer
          minimum: 1

    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^(?![\s\S]*[\x00-\x1F\x7F])\S(?:[\s\S]*\S)?$'
      writeOnly: true
      description: Contraseña nueva sin caracteres de control, espacios exteriores ni claves comunes, repetitivas o de ejemplo. Se persiste únicamente como hash.

    CurrentPassword:
      type: string
      minLength: 1
      maxLength: 128
      writeOnly: true
      description: Contraseña actual; conserva compatibilidad con credenciales históricas.

    LoginInput:
      type: object
      required:
        - usuario
        - password
      properties:
        usuario:
          type: string
          description: Nombre de usuario asignado al crear la cuenta (no el email)
        password:
          $ref: "#/components/schemas/CurrentPassword"

    OwnPasswordChangeInput:
      type: object
      required:
        - password_actual
        - password_nueva
      properties:
        password_actual:
          $ref: "#/components/schemas/CurrentPassword"
        password_nueva:
          $ref: "#/components/schemas/NewPassword"

    AuthUser:
      type: object
      required:
        - id
        - nombre
        - email
        - rol
        - debe_cambiar_password
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: ["string", "null"]
        email:
          type: string
        rol:
          type: string
          description: Nombre del rol asignado
        debe_cambiar_password:
          type: boolean
          readOnly: true
          description: Indica que la clave actual es temporal y debe reemplazarse antes de usar la aplicación.

    AdminRole:
      type: object
      required:
        - id
        - nombre
        - descripcion
        - activo
        - fecha_creacion
        - fecha_actualizacion
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type: ["string", "null"]
        activo:
          type: boolean
        fecha_creacion:
          type: string
          format: date-time
        fecha_actualizacion:
          type: string
          format: date-time

    AdminRoleInput:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        descripcion:
          type: ["string", "null"]
          maxLength: 500
        activo:
          type: boolean
          default: true

    AdminRoleUpdate:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        descripcion:
          type: ["string", "null"]
          maxLength: 500
        activo:
          type: boolean

    AdminRoleListResponse:
      type: object
      required:
        - roles
        - total
        - page
        - limit
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AdminRole"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    AdminUser:
      type: object
      required:
        - id
        - nombre
        - apellido
        - username
        - email
        - role_id
        - activo
        - debe_cambiar_password
        - fecha_creacion
        - fecha_actualizacion
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
          description: Identificador de login. Nullable solo por compatibilidad con filas muy viejas; el backend lo backfillea al arrancar.
        email:
          type: string
        role_id:
          type: integer
        activo:
          type: boolean
        debe_cambiar_password:
          type: boolean
          readOnly: true
          description: Indica que la contraseña fue emitida por administración y todavía no fue reemplazada por el usuario.
        fecha_creacion:
          type: string
          format: date-time
        fecha_actualizacion:
          type: string
          format: date-time

    AdminUserInput:
      type: object
      required:
        - nombre
        - username
        - password
        - email
        - role_id
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        apellido:
          type: ["string", "null"]
          maxLength: 100
        username:
          type: string
          description: Identificador de login que se le entrega al usuario junto con la contraseña.
          minLength: 3
          maxLength: 60
          pattern: '^\S+$'
        password:
          $ref: "#/components/schemas/NewPassword"
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          maxLength: 254
        role_id:
          type: integer
          minimum: 1
        activo:
          type: boolean
          default: true

    AdminUserDeleteInput:
      type: object
      additionalProperties: false
      required:
        - confirmar
        - username
      properties:
        confirmar:
          type: boolean
          description: Debe ser exactamente true. Primera aprobación.
        username:
          type: string
          description: >
            Nombre de usuario exacto de la cuenta a eliminar. Segunda
            aprobación: obliga a identificar a la persona, no solo el id.
          minLength: 1
          maxLength: 60

    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        apellido:
          type: ["string", "null"]
          maxLength: 100
        username:
          type: string
          minLength: 3
          maxLength: 60
          pattern: '^\S+$'
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          maxLength: 254
        role_id:
          type: integer
          minimum: 1
        activo:
          type: boolean

    AdminUserPasswordInput:
      type: object
      required:
        - password
      properties:
        password:
          $ref: "#/components/schemas/NewPassword"

    AdminUserListResponse:
      type: object
      required:
        - users
        - total
        - page
        - limit
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    AdminImportInput:
      type: object
      required:
        - csv
      properties:
        csv:
          type: string
          description: Contenido completo del archivo CSV (texto plano)
        dry_run:
          type: boolean
          default: false
          description: Si es true, simula la importación sin escribir nada

    AdminImportColumna:
      type: object
      required:
        - columna
        - campo
      properties:
        columna:
          type: string
          description: Encabezado original del CSV
        campo:
          type: string
          description: Campo del ticket al que se mapeó

    AdminImportResult:
      type: object
      required:
        - dry_run
        - filas
        - insertados
        - ya_existentes
        - invalidos
        - columnas
        - sin_mapear
        - advertencias
      properties:
        dry_run:
          type: boolean
        filas:
          type: integer
          description: Filas de datos leídas del CSV
        insertados:
          type: integer
        ya_existentes:
          type: integer
        invalidos:
          type: integer
        columnas:
          type: array
          items:
            $ref: "#/components/schemas/AdminImportColumna"
        sin_mapear:
          type: array
          items:
            type: string
        advertencias:
          type: array
          items:
            type: string

    AdminTruncateInput:
      type: object
      required:
        - confirmar
      properties:
        confirmar:
          type: boolean
          description: Debe ser true para ejecutar el borrado

    AdminTruncateResult:
      type: object
      required:
        - tickets_eliminados
        - seguimientos_eliminados
      properties:
        tickets_eliminados:
          type: integer
        seguimientos_eliminados:
          type: integer

    TicketIngestResult:
      type: object
      required:
