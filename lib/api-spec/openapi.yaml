        - limit
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    TicketInput:
      type: object
      required:
        - conversation_id
        - hora
        - nombre
        - apellido
        - motivo
      properties:
        conversation_id:
          type: string
        hora:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        dni:
          type: string
        empresa:
          type: string
        estado_empleado:
          type: string
          enum: [Activo, Inactivo]
          description: Estado laboral informado para el contacto
        email:
          type: string
        motivo:
          type: string
        resumen:
          type: string
        notificado:
          type: boolean
          default: false
        estado:
          type: string
          enum: [nuevo, en_proceso, pendiente, resuelto, cerrado]
          default: nuevo
        prioridad:
          type: string
          enum: [baja, media, alta, urgente]
          default: media
        asignado_a:
          type: string
          description: Valor histórico o externo; las autoasignaciones internas se derivan de la sesión
        audio_url:
          type: string
        notas:
          type: string
        fecha_limite:
          type: string
          format: date-time
          description: Fecha explícita opcional; si se omite, el backend calcula 48 horas hábiles de lunes a viernes
        progreso:
          type: integer
          minimum: 0
          maximum: 100
          default: 0

    TicketUpdate:
      type: object
