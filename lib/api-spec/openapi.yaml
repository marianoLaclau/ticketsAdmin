    Ticket:
      type: object
      required:
        - id
        - version
        - conversation_id
        - hora
        - nombre
        - apellido
        - telefono
        - dni
        - empresa
        - estado_empleado
        - email
        - motivo
        - motivo_categoria
        - resumen
        - notificado
        - estado
        - prioridad
        - asignado_usuario_id
        - asignado_a
        - audio_url
        - notas
        - fecha_creacion
        - fecha_limite
        - fecha_resolucion
        - progreso
      properties:
        id:
          type: integer
        version:
          type: integer
          minimum: 1
          readOnly: true
          description: Versión monotónica usada para evitar sobrescrituras concurrentes
        conversation_id:
          type: string
        hora:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: ["string", "null"]
        dni:
          type: ["string", "null"]
        empresa:
          type: ["string", "null"]
        estado_empleado:
          type: ["string", "null"]
          enum: [Activo, Inactivo, null]
          description: Estado laboral informado; usa null sin empresa y la interfaz solo muestra el valor cuando existe una empresa asociada
        email:
          type: ["string", "null"]
        motivo:
          type: string
        motivo_categoria:
          $ref: "#/components/schemas/MotivoCategoria"
        resumen:
          type: ["string", "null"]
        notificado:
          type: boolean
        estado:
          type: string
          enum: [nuevo, en_proceso, pendiente, resuelto, cerrado]
        prioridad:
          type: string
          enum: [baja, media, alta, urgente]
        asignado_usuario_id:
          type: ["integer", "null"]
          description: Identidad autoritativa del usuario asignado; la establece el backend al cambiar el estado
        asignado_a:
          type: ["string", "null"]
          description: Nombre visible del responsable o valor histórico/importado
        audio_url:
          type: ["string", "null"]
        notas:
          type: ["string", "null"]
        fecha_creacion:
          type: string
          format: date-time
        fecha_limite:
          type: ["string", "null"]
          format: date-time
          description: Vencimiento; el default automático suma 48 horas hábiles de lunes a viernes
        fecha_resolucion:
          type: ["string", "null"]
          format: date-time
        progreso:
          type: integer
          minimum: 0
          maximum: 100

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required:
            - seguimientos
          properties:
            seguimientos:
              type: array
              items:
                $ref: "#/components/schemas/Seguimiento"

    TicketListResponse:
      type: object
      required:
