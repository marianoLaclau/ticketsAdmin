name: ticketsadmin

services:
  backend:
    image: ${TICKETSADMIN_BACKEND_IMAGE:-ticketsadmin-backend:local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        TICKETSADMIN_IMAGE_REVISION: ${TICKETSADMIN_IMAGE_REVISION:-development}
        TICKETSADMIN_IMAGE_SOURCE: ${TICKETSADMIN_IMAGE_SOURCE:-local}
        TICKETSADMIN_RELEASE_ID: ${TICKETSADMIN_RELEASE_ID:-development}
        TICKETSADMIN_COMPOSE_CONTRACT_SHA256: ${TICKETSADMIN_COMPOSE_CONTRACT_SHA256:-development}
        TICKETSADMIN_DB_ROLLBACK_EPOCH: ${TICKETSADMIN_DB_ROLLBACK_EPOCH:-development}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:?WEBHOOK_API_KEY is required — export it or set it in a .env next to this file}
      # Obligatoria: segunda credencial de las operaciones SysAdmin
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required — export it or set it in a .env next to this file}
      # Solo inicializa una base sin hashes o asegura el seed heredado.
      BOOTSTRAP_SYSADMIN_PASSWORD: ${BOOTSTRAP_SYSADMIN_PASSWORD:-}
      TICKETS_DB_PATH: /data/tickets.db
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      PRIORIDAD_AUTOMATICA_INTERVAL_MS: ${PRIORIDAD_AUTOMATICA_INTERVAL_MS:-300000}
    volumes:
      - tickets_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch(''http://127.0.0.1:5000/api/readyz'').then(async r => process.exit(r.status === 200 && await r.text() === ''{"status":"ready"}'' ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      # Migraciones, bootstrap y reconciliaciones ocurren antes de escuchar.
      # Un éxito dentro de este período vuelve healthy al servicio de inmediato.
      start_period: 60s

  frontend:
    image: ${TICKETSADMIN_FRONTEND_IMAGE:-ticketsadmin-frontend:local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        TICKETSADMIN_IMAGE_REVISION: ${TICKETSADMIN_IMAGE_REVISION:-development}
        TICKETSADMIN_IMAGE_SOURCE: ${TICKETSADMIN_IMAGE_SOURCE:-local}
        TICKETSADMIN_RELEASE_ID: ${TICKETSADMIN_RELEASE_ID:-development}
        TICKETSADMIN_COMPOSE_CONTRACT_SHA256: ${TICKETSADMIN_COMPOSE_CONTRACT_SHA256:-development}
        TICKETSADMIN_DB_ROLLBACK_EPOCH: ${TICKETSADMIN_DB_ROLLBACK_EPOCH:-development}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
        # Si Compose reemplaza explícitamente el backend, recrea Nginx para que
        # resuelva otra vez su nombre en la red interna.
        restart: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'spa="$$(wget -qO- http://127.0.0.1/)" && printf ''%s'' "$$spa" | grep -Fq ''<div id="root"></div>'' && ready="$$(wget -qO- http://127.0.0.1/api/readyz)" && printf ''%s'' "$$ready" | grep -Fxq ''{"status":"ready"}''',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  tickets_data:
