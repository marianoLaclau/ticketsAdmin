name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copia el SQLite antes de tocar nada. Es data real de llamadas y las
      # migraciones se aplican solas al arrancar el backend, así que este es el
      # único punto de retorno. Si el backup falla, el deploy NO sigue.
      # Usa la API de backup de SQLite (no `cp`) para ser consistente aun con
      # el WAL activo si el backend todavía está corriendo.
      - name: Backup SQLite
        run: |
          set -euo pipefail
          mkdir -p /var/lib/ticketsadmin/backups
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          if docker volume inspect ticketsadmin_tickets_data >/dev/null 2>&1; then
            docker run --rm \
              -v ticketsadmin_tickets_data:/data:ro \
              -v /var/lib/ticketsadmin/backups:/backups \
              alpine:3 \
              sh -c "set -e
                     if [ ! -f /data/tickets.db ]; then
                       echo 'No hay base previa: instalación nueva, nada que respaldar.'
                       exit 0
                     fi
                     apk add --no-cache sqlite >/dev/null
                     sqlite3 /data/tickets.db \".backup '/backups/pre-deploy-$stamp.db'\"
                     sqlite3 /backups/pre-deploy-$stamp.db 'PRAGMA integrity_check;' | grep -Fxq ok
                     echo \"Backup verificado: pre-deploy-$stamp.db\""
          else
            echo "El volumen todavía no existe: instalación nueva, nada que respaldar."
          fi

      - name: Build images
        run: docker compose build
        env:
          WEBHOOK_API_KEY: not-used-during-image-build

      - name: Deploy
        run: docker compose up -d --wait --wait-timeout 180
        env:
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
          BOOTSTRAP_SYSADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_SYSADMIN_PASSWORD }}

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:5000/api/readyz | grep -Fq '{"status":"ready"}'
          curl -fsS --max-time 10 http://127.0.0.1:3000/ | grep -Fq '<div id="root"></div>'
          echo "Backend y frontend responden correctamente."

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=150 backend frontend || true
        env:
          WEBHOOK_API_KEY: not-used-for-deploy-diagnostics
