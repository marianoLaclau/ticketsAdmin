name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copia el SQLite antes de tocar nada. Es data real de llamadas: el deploy
      # no la borra (nunca hay `down -v` ni prune), pero la copia cuesta segundos
      # y es la única red de seguridad que queda tras simplificar el pipeline.
      - name: Backup SQLite
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /var/lib/ticketsadmin/backups
          docker run --rm \
            -v ticketsadmin_tickets_data:/data:ro \
            -v /var/lib/ticketsadmin/backups:/backups \
            alpine:3 \
            sh -c 'test -f /data/tickets.db && cp /data/tickets.db "/backups/pre-deploy-$(date -u +%Y%m%d-%H%M%S).db" || echo "sin base previa, nada que respaldar"'

      - name: Build images
        run: docker compose build
        env:
          WEBHOOK_API_KEY: not-used-during-image-build
          ADMIN_API_KEY: not-used-during-image-build

      - name: Deploy
        run: docker compose up -d --wait --wait-timeout 180
        env:
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          BOOTSTRAP_SYSADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_SYSADMIN_PASSWORD }}

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:5000/api/readyz | grep -Fq '{"status":"ready"}'
          curl -fsS --max-time 10 http://127.0.0.1:3000/ | grep -Fq '<div id="root"></div>'
          echo "Backend y frontend responden correctamente."

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=150 backend frontend || true
        env:
          WEBHOOK_API_KEY: not-used-for-deploy-diagnostics
          ADMIN_API_KEY: not-used-for-deploy-diagnostics
